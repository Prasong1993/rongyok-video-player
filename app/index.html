<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Rongyok Video Player">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">

  <!-- iOS จำเป็นต้องมี -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rongyok">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- อื่นๆ -->
  <meta name="format-detection" content="telephone=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css">
  <title>Rongyok Video Player</title>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Rongyok</h1>
      <p class="sub">Video Player</p>
    </header>

    <section class="player-box">
      <!-- ✅ ผ่านกฎ iOS 100%: playsinline 3 แบบ ไม่มี autoplay ไม่มี muted บังคับ -->
      <video
        id="video"
        playsinline
        webkit-playsinline
        x5-playsinline
        controls
        preload="metadata"
        poster=""
      ></video>
    </section>

    <section class="list" id="list">
      <!-- การ์ดคลิปจะถูกใส่ที่นี่จาก app.js -->
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
