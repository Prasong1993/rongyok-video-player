<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rongyok Player">
    <meta name="description" content="เครื่องเล่นวิดีโอส่วนตัวสำหรับ rongyok.com">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230f172a' width='192' height='192'/><text x='96' y='110' font-size='80' font-weight='bold' fill='%2300d9ff' text-anchor='middle' font-family='sans-serif'>RP</text></svg>">
    
    <title>Rongyok Player - เครื่องเล่นวิดีโอส่วนตัว</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="app">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-content">
                <div class="navbar-brand">
                    <span class="brand-icon">🎬</span>
                    <h1>Rongyok Player</h1>
                </div>
                <div class="navbar-tabs">
                    <button class="tab-btn active" data-tab="home">🏠 หน้าหลัก</button>
                    <button class="tab-btn" data-tab="history">📜 ประวัติ</button>
                    <button class="tab-btn" data-tab="bookmarks">⭐ ที่คั่น</button>
                </div>
            </div>
        </nav>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="🔍 ค้นหาวิดีโอ...">
            <button id="refresh-btn" class="refresh-btn" title="รีเฟรชรายการ">🔄</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Home Tab -->
            <div id="home-tab" class="tab-content active">
                <div id="video-list" class="video-grid">
                    <div class="loading">⏳ กำลังโหลดรายการ...</div>
                </div>
            </div>

            <!-- History Tab -->
            <div id="history-tab" class="tab-content">
                <div class="tab-header">
                    <h2>📜 ประวัติการดู</h2>
                    <button id="clear-history-btn" class="clear-btn">🗑️ ลบทั้งหมด</button>
                </div>
                <div id="history-list" class="video-grid">
                    <div class="empty-state">ยังไม่มีประวัติการดู</div>
                </div>
            </div>

            <!-- Bookmarks Tab -->
            <div id="bookmarks-tab" class="tab-content">
                <div class="tab-header">
                    <h2>⭐ ที่คั่นหน้า</h2>
                    <button id="clear-bookmarks-btn" class="clear-btn">🗑️ ลบทั้งหมด</button>
                </div>
                <div id="bookmarks-list" class="video-grid">
                    <div class="empty-state">ยังไม่มีที่คั่น</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/proxy.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
